services:
  autoresearching-ai-dev-write:
    container_name: autoresearching-ai-dev-write
    image: autoresearching-ai-dev-write:latest
    user: root
    network_mode: "host"
    restart: always
    env_file:
      - .env
    volumes:
      - /etc/localtime:/etc/localtime:ro
    command: ["python", "main_write.py"]
    logging:
      driver: "json-file"
      options:
        max-size: "10g"
        max-file: "2"